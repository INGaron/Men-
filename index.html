<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Green Salad · Menú 3D</title>
<script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f5f2ea;color:#1f1b1c}
header{background:#1f1b1c;color:#7ea36b;padding:16px;font-size:22px;font-weight:800;position:sticky;top:0;z-index:5}
header small{display:block;color:#a9a69c;font-size:10px;letter-spacing:.3em;font-weight:400}
.sub{padding:14px 16px 4px;color:#6c6a62;font-size:14px}
.list{padding:8px 16px 40px;display:grid;gap:12px;max-width:560px;margin:auto}
.card{background:#fffdf8;border-radius:16px;padding:14px;box-shadow:0 6px 18px -10px rgba(0,0,0,.4)}
.card h3{margin:0;font-size:17px;display:flex;justify-content:space-between;gap:8px}
.card h3 span{color:#3a5f2e}
.card p{margin:6px 0 10px;font-size:13px;color:#6c6a62}
button{font:inherit;border:0;cursor:pointer;border-radius:12px;padding:11px 14px;font-weight:700}
.go{background:#1f1b1c;color:#fff;width:100%}
dialog{border:0;padding:0;border-radius:20px;width:min(560px,94vw);overflow:hidden}
dialog::backdrop{background:rgba(0,0,0,.7)}
model-viewer{width:100%;height:55vh;background:radial-gradient(#fff,#e9e5d8)}
.ar{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:#1f1b1c;color:#fff;border-radius:999px}
.info{padding:12px 16px 16px}
.info h3{margin:0}
.x{position:absolute;right:10px;top:10px;z-index:3;border-radius:50%;width:38px;height:38px;padding:0;background:#fff}
.note{background:#fff3d6;color:#6a5416;font-size:12px;padding:8px 12px;margin:0}
</style>
</head>
<body>
<header>Green Salad<small>HEALTHY FOOD · MENÚ 3D</small></header>
<div class="sub">Toca un plato y velo en 3D o en tu mesa.</div>
<div class="list" id="list"></div>

<dialog id="dlg">
  <button class="x" onclick="dlg.close()">×</button>
  <div style="position:relative">
    <model-viewer id="mv" camera-controls auto-rotate shadow-intensity="1" ar ar-modes="webxr scene-viewer quick-look" ar-scale="auto" alt="Plato en 3D">
      <button slot="ar-button" class="ar">📱 Ver en mi mesa (AR)</button>
    </model-viewer>
  </div>
  <p class="note">Modelo de prueba. Luego se cambia por el plato real.</p>
  <div class="info"><h3 id="t"></h3><p id="i"></p></div>
</dialog>

<script>
const MODEL = "https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Models@master/2.0/Avocado/glTF-Binary/Avocado.glb";
const BACKUP = "https://modelviewer.dev/shared-assets/models/Astronaut.glb";
const D = [
 ["Mamita Honey",450,"Pollo, aguacate, cheddar, bacon, tomate cherry, cebolla, maíz, croutons"],
 ["Chili Salad",449,"Chili, maíz, cheddar, plátano maduro, aguacate, tortilla chips, pico de gallo"],
 ["La Bariátrica Salad",399,"Pechuga de pollo, bacon, aguacate, pita chips"],
 ["Salad 100% Protein",449,"Pechuga de pollo, 2 huevos, bacon, cheddar"],
 ["Chicken BBQ",299,"Lechuga mix, pollo, aguacate, mozzarella"],
 ["Chipotle Chicken Salad",299,"Pollo, tomate rostizado, maíz"],
 ["Chicken Caesar Salad",349,"Lechuga mix, pollo, parmesano, tomate cherry, croutons, huevo"],
 ["Mix Salad",299,"Lechuga mix, pollo, cheddar, tortilla chip, bacon"],
 ["Ryan Salad",449,"Aguacate, pollo, plátano maduro, huevo, cheddar, maíz, bacon"],
 ["Goat Salad",449,"Tomate rostizado, queso de cabra, pollo, cranberry, croutons"],
 ["Pork Belly Salad",449,"Chicharrón, cebolla, pico de gallo, guacamole, plátano maduro"],
 ["Keto Salad",449,"Steak Angus, bacon, aguacate, huevo, pico de gallo"],
 ["Bacon Salad",399,"Bacon, tomate rostizado, cebolla, cheddar, tortilla chips"],
 ["Steak Angus",599,"Lechuga mix, Angus steak, tomate rostizado, rúcula, cheddar, habichuela negra, bacon"],
 ["Steak Salad",549,"Lechuga mix, aguacate, Angus steak, croutons, tomate rostizado, aceitunas, cebolla caramelizada"],
 ["Tuna Salad",399,"Maíz, aguacate, pico de gallo, tuna en agua"],
 ["Shrimp Salad",499,"Maíz, pico de gallo, aguacate, camarones"],
 ["Salmon Honey Mustard",590,"Salmón desmenuzado, aguacate, plátano maduro, nueces, tortilla chips"],
 ["Healthy Salmon Salad",699,"Rúcula, salmón sellado, aceitunas negras, tomate rostizado, parmesan crisp"],
 ["Mozzarella Salad",249,"Rúcula, lechuga mix, tomate cherry, mozzarella"],
 ["Vegan Gluten Free",399,"Tofu, maíz, tomate rostizado, cebolla"]
];
const dlg = document.getElementById("dlg"), mv = document.getElementById("mv");
mv.addEventListener("error", () => mv.setAttribute("src", BACKUP));
D.forEach(([n, p, ing], k) => {
  const c = document.createElement("div");
  c.className = "card";
  c.innerHTML = `<h3>${n}<span>RD$${p}</span></h3><p>${ing}</p><button class="go" data-k="${k}">◎ Ver en 3D</button>`;
  document.getElementById("list").appendChild(c);
});
document.getElementById("list").onclick = e => {
  const k = e.target.dataset.k;
  if (k === undefined) return;
  const d = D[k];
  mv.setAttribute("src", MODEL);
  document.getElementById("t").textContent = d[0] + " · RD$" + d[1];
  document.getElementById("i").textContent = d[2];
  dlg.showModal();
};
</script>
</body>
</html>
