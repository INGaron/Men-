        :root {
            --bg: #0f0d0e;
            --bg2: #161314;
            --card: #1b1718;
            --line: rgba(255, 255, 255, 0.09);
            --text: #f4f1ea;
            --muted: #a9a59a;
            --sage: #8fb77a;
            --sage-dark: #5f8c4c;
            --lime: #c9f06b;
            --warn: #ff7a59;
            --radius: 22px;
            --font: 'Poppins', sans-serif;
        }

        /* ================= ESTILOS GENERALES ================= */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--font);
            line-height: 1.45;
            padding-bottom: 100px;
            overflow-x: hidden;
        }
        a { color: inherit; text-decoration: none; }
        img { display: block; max-width: 100%; }
        button { font: inherit; color: inherit; border: none; cursor: pointer; background: none; }
        
        .wrap {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 18px;
        }

        /* ================= BARRA SUPERIOR ================= */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 30;
            background: rgba(15, 13, 14, 0.85);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--line);
        }
        .bar-in {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 70px;
        }
        .logo b { font-size: 22px; font-weight: 800; color: var(--sage); letter-spacing: -0.6px; }
        .logo b span { color: #d9d6cd; font-weight: 600; font-size: 15px; }
        .logo small { display: block; font-size: 9px; letter-spacing: 0.3em; color: var(--muted); margin-top: 2px; }
        
        .cart-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--lime);
            color: #13200a;
            font-weight: 700;
            font-size: 14px;
            padding: 10px 16px;
            border-radius: 999px;
            transition: transform 0.2s;
        }
        .cart-btn:active { transform: scale(0.95); }
        .cart-btn i {
            font-style: normal;
            background: #13200a;
            color: var(--lime);
            min-width: 22px;
            height: 22px;
            border-radius: 999px;
            display: grid;
            place-items: center;
            font-size: 12px;
            padding: 0 6px;
        }

        /* ================= HERO (PORTADA) ================= */
        .hero {
            position: relative;
            min-height: 50vh;
            display: flex;
            align-items: center;
            background: linear-gradient(rgba(15, 13, 14, 0.8), var(--bg)), url('https://images.unsplash.com/photo-1512621776951-a57141f2eefd?q=80&w=1000&auto=format&fit=crop') center/cover;
            padding: 60px 0;
            border-bottom: 1px solid var(--line);
        }
        .hero-in { position: relative; z-index: 2; width: 100%; }
        .eyebrow {
            display: inline-block;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.1em;
            color: var(--lime);
            background: rgba(201, 240, 107, 0.1);
            padding: 6px 12px;
            border-radius: 99px;
            margin-bottom: 16px;
        }
        .hero h1 { font-size: clamp(32px, 6vw, 54px); line-height: 1.1; margin-bottom: 16px; }
        .hero h1 em { color: var(--sage); font-style: normal; }
        .hero p { color: var(--muted); font-size: 16px; max-width: 500px; }
        .cta { margin-top: 24px; }
        .btn {
            display: inline-block;
            background: var(--sage);
            color: #0f0d0e;
            font-weight: 700;
            padding: 14px 24px;
            border-radius: 99px;
            text-align: center;
            transition: 0.2s;
        }
        .btn:hover { background: var(--lime); }

        /* ================= FILTROS Y BUSCADOR ================= */
        .filters { padding: 30px 0 10px; position: sticky; top: 70px; background: var(--bg); z-index: 20; border-bottom: 1px solid var(--line); }
        .search {
            width: 100%;
            padding: 16px 20px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            color: var(--text);
            font-size: 16px;
            margin-bottom: 16px;
            outline: none;
        }
        .search:focus { border-color: var(--sage); }
        .pills { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 16px; scrollbar-width: none; }
        .pills::-webkit-scrollbar { display: none; }
        .pill {
            padding: 8px 16px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 99px;
            font-size: 14px;
            white-space: nowrap;
            transition: 0.2s;
        }
        .pill.active { background: var(--sage); color: #0f0d0e; border-color: var(--sage); font-weight: 700; }

        /* ================= TARJETAS DE PLATOS ================= */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            padding: 30px 0 60px;
        }
        .card {
            background: var(--card);
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--line);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s;
        }
        .card:hover { transform: translateY(-4px); border-color: var(--sage-dark); }
        .card-img {
            height: 220px;
            background-size: cover;
            background-position: center;
            position: relative;
        }
        .badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(15, 13, 14, 0.85);
            backdrop-filter: blur(4px);
            color: var(--lime);
            font-size: 11px;
            font-weight: 700;
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid var(--line);
            text-transform: uppercase;
        }
        .card-body { padding: 20px; display: flex; flex-direction: column; flex: 1; }
        .card-title { font-size: 20px; font-weight: 800; margin-bottom: 6px; }
        .card-ing { font-size: 13px; color: var(--muted); margin-bottom: 16px; flex: 1; line-height: 1.5; }
        .card-bottom { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
        .price { font-size: 22px; font-weight: 800; color: var(--sage); }
        .add-btn {
            background: var(--card);
            border: 1px solid var(--sage);
            color: var(--sage);
            padding: 10px 16px;
            border-radius: 99px;
            font-weight: 600;
            font-size: 14px;
            transition: 0.2s;
        }
        .add-btn:hover { background: var(--sage); color: var(--bg); }
        .add-btn:active { transform: scale(0.95); }

        /* ================= CARRITO MODAL ================= */
        .cart-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            z-index: 100;
            display: flex;
            justify-content: flex-end;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .cart-modal.open { opacity: 1; pointer-events: all; }
        .cart-content {
            background: var(--bg2);
            width: 100%;
            max-width: 400px;
            height: 100%;
            padding: 24px;
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-left: 1px solid var(--line);
        }
        .cart-modal.open .cart-content { transform: translateX(0); }
        
        .cart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .cart-header h2 { font-size: 24px; }
        .close-cart { font-size: 28px; color: var(--muted); }
        
        .cart-items { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); padding-bottom: 16px; }
        .cart-item-info h4 { font-size: 15px; margin-bottom: 4px; }
        .cart-item-info p { color: var(--sage); font-weight: 600; font-size: 14px; }
        .cart-controls { display: flex; align-items: center; gap: 12px; background: var(--card); padding: 4px 10px; border-radius: 99px; border: 1px solid var(--line); }
        .cart-controls button { font-size: 18px; font-weight: bold; color: var(--text); }
        
        .cart-footer { margin-top: 24px; border-top: 1px solid var(--line); padding-top: 20px; }
        .cart-total { display: flex; justify-content: space-between; font-size: 20px; font-weight: 800; margin-bottom: 20px; }
        .checkout-btn {
            width: 100%;
            background: #25D366; /* Color WhatsApp */
            color: #fff;
            font-weight: 700;
            font-size: 16px;
            padding: 16px;
            border-radius: 99px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .empty-cart { text-align: center; color: var(--muted); margin-top: 40px; }

    </style>
</head>

            }

            filtered.forEach(function(d) {
                var card = document.createElement("div");
                card.className = "card";
                
                var badgeHTML = d.feat ? '<div class="badge">Popular</div>' : '';

                card.innerHTML = `
                    <div class="card-img" style="background-image: url('${d.img}')">
                        ${badgeHTML}
                    </div>
                    <div class="card-body">
                        <h3 class="card-title">${d.name}</h3>
                        <p class="card-ing"><b>Ingredientes:</b> ${d.ing}<br><b>Dressing:</b> ${d.dress}</p>
                        <div class="card-bottom">
                            <span class="price">${formatMoney(d.price)}</span>
                            <button class="add-btn" onclick="addToCart('${d.id}')">+ Agregar</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // ================= LÓGICA DEL CARRITO =================
        function addToCart(id) {
            if (cart[id]) {
                cart[id]++;
            } else {
                cart[id] = 1;
            }
            saveCart();
            document.getElementById("cartModal").classList.add("open");
        }

        function changeQty(id, delta) {
            if (!cart[id]) return;
            cart[id] += delta;
            if (cart[id] <= 0) delete cart[id];
            saveCart();
        }

        function updateCartUI() {
            var count = 0;
            var total = 0;
            var container = document.getElementById("cartItems");
            container.innerHTML = "";

            var keys = Object.keys(cart);
            if (keys.length === 0) {
                container.innerHTML = "<p class='empty-cart'>Tu carrito está vacío. ¡Agrega una ensalada!</p>";
            }

            keys.forEach(function(id) {
                var dish = DISHES.find(function(d) { return d.id === id; });
                if (!dish) return;
                
                var qty = cart[id];
                count += qty;
                total += (dish.price * qty);

                var div = document.createElement("div");
                div.className = "cart-item";
                div.innerHTML = `
                    <div class="cart-item-info">
                        <h4>${dish.name}</h4>
                        <p>${formatMoney(dish.price)}</p>
                    </div>
                    <div class="cart-controls">
                        <button onclick="changeQty('${id}', -1)">−</button>
                        <span>${qty}</span>
                        <button onclick="changeQty('${id}', 1)">+</button>
                    </div>
                `;
                container.appendChild(div);
            });

            document.getElementById("cartCount").textContent = count;
            document.getElementById("cartTotal").textContent = formatMoney(total);
        }

        // ================= WHATSAPP CHECKOUT =================
        document.getElementById("checkoutBtn").onclick = function() {
            if (Object.keys(cart).length === 0) {
                alert("Tu carrito está vacío. Agrega algún plato primero.");
                return;
            }

            var message = "¡Hola *" + BUSINESS.name + "*! 👋 Quisiera hacer el siguiente pedido:\n\n";
            var total = 0;

            Object.keys(cart).forEach(function(id) {
                var dish = DISHES.find(function(d) { return d.id === id; });
                var qty = cart[id];
                var subtotal = dish.price * qty;
                total += subtotal;
                message += "▪️ " + qty + "x " + dish.name + " — " + formatMoney(subtotal) + "\n";
            });

            message += "\n*Total:* " + formatMoney(total) + "\n";
            message += "_( " + BUSINESS.taxNote + " )_\n\n";
            message += "Por favor, confírmenme la disponibilidad y el tiempo de entrega. ¡Gracias!";

            var url = "https://wa.me/" + BUSINESS.whatsapp + "?text=" + encodeURIComponent(message);
            window.open(url, "_blank");
        };

        // ================= EVENTOS =================
        document.getElementById("searchInput").addEventListener("input", renderDishes);
        document.getElementById("openCart").onclick = function() { document.getElementById("cartModal").classList.add("open"); };
        document.getElementById("closeCart").onclick = function() { document.getElementById("cartModal").classList.remove("open"); };
        
        // Cerrar modal al dar clic fuera
        document.getElementById("cartModal").onclick = function(e) {
            if (e.target === this) this.classList.remove("open");
        };

        // ================= INICIALIZACIÓN =================
        renderCategories();
        renderDishes();
        updateCartUI();

    </script>
</body>
</html>
